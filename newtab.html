<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva pestaña</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header id="topbar">
    <div id="brand">GraphMarks</div>
    <nav id="views" aria-label="Graph view"></nav>
    <div id="searchwrap">
      <input id="search" type="search" data-i18n-attr="placeholder:searchPlaceholder" autocomplete="off" spellcheck="false">
      <ul id="results" hidden></ul>
    </div>
    <nav id="legend" aria-label="Clusters"></nav>
    <button id="winchip" hidden data-i18n-attr="title:winChipTitle"></button>
    <button id="tabcount" hidden data-i18n-attr="title:tabCountTitle"></button>
    <button id="sessions" data-i18n-attr="title:sessionsTitle"></button>
    <button id="settings-btn" data-i18n-attr="title:settingsTitle">⚙</button>
    <button id="list-toggle" data-i18n="listOpen"></button>
  </header>

  <main id="stage">
    <canvas id="graph"></canvas>
    <div id="tooltip" role="status" hidden></div>
    <div id="empty" hidden></div>
  </main>

  <aside id="list-panel" hidden aria-label="Bookmark list"></aside>

  <div id="ctxmenu" hidden></div>
  <dialog id="dlg"></dialog>
  <div id="toast" hidden></div>

  <footer id="hint" data-i18n="hint"></footer>

  <script src="mock-data.js"></script>
  <script src="seed-tags.js"></script>
  <script src="dist/newtab.js"></script>
</body>
</html>
