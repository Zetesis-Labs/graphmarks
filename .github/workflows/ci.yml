name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Smoke test de la preview (todas las vistas)
        run: |
          for q in "" "?view=tags" "?view=domains" "?view=history" "?filter=open"; do
            "${{ steps.chrome.outputs.chrome-path }}" --headless --disable-gpu \
              --no-sandbox --screenshot=out.png --window-size=1600,1000 \
              --virtual-time-budget=9000 "file://$PWD/newtab.html$q"
            test -s out.png && echo "OK newtab.html$q"
            rm -f out.png
          done

      - name: Smoke test de la UI (modales, paleta, chips reactivos)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm smoke:ui
